name: UnicoPlay Web

on:
  push:
    branches: [main]
  pull_request:
  # Тесты идут на боевом сайте, поэтому запускаются только вручную: Actions → UnicoPlay Web → Run workflow
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck, ESLint, Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  tests:
    name: Регрессия UnicoPlay Web
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Серверы GitHub в США: сайт показывает им каталог для зарубежного пользователя (test-data/region.ts)
      REGION: intl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Google Chrome, а не Chromium из комплекта Playwright: в Chromium нет кодеков H.264/AAC для видео
      - run: npx playwright install --with-deps chrome

      - name: Регрессионный набор UnicoPlay Web
        # Вход в тестовый аккаунт — по коду из письма: секреты TEST_EMAIL и GMAIL_APP_PASSWORD.
        # Без них тесты со входом пропускаются, остальные идут
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: npx playwright test

      - name: HTML-отчёт
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
